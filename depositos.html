<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Depósitos</title>
    <link rel="stylesheet" href="/src/css/depositos.css" />
</head>

<body>
    <include src="header.html"></include>

    <main>
        <a href="home.html">← Volver al inicio</a>

        <p id="mensaje-depositos">Cargando depósitos...</p>

        <div class="tabla-scroll">

                <tbody id="body-depositos"></tbody>

    <include src="footer.html"></include>

    <script type="module" src="/src/js/depositos.js"></script>
