<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Depósitos</title>
    <link rel="stylesheet" href="/src/css/depositos.css" />
</head>

<body>
    <include src="header.html"></include>

    <main>
        <a href="home.html">← Volver al inicio</a>
        <h1>Depósitos</h1>
        <a class="btn" href="deposito-form.html">Nuevo depósito</a>

        <p id="mensaje-depositos">Cargando depósitos...</p>

        <div id="contenido" hidden>
            <div class="tabla-scroll">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Nombre</th>
                            <th scope="col">Colonia</th>
                            <th scope="col">Tipo</th>
                            <th scope="col">Capacidad (L)</th>
                            <th scope="col">Nivel actual (L)</th>
                            <th scope="col">% llenado</th>
                            <th scope="col">Estado</th>
                            <th scope="col">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="body-depositos"></tbody>
                </table>
            </div>

            <h2 class="seccion">Fuentes de abastecimiento</h2>
            <div class="tabla-scroll">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Fuente</th>
                            <th scope="col">Tipo</th>
                            <th scope="col">Ubicación</th>
                            <th scope="col">Suministro (L)</th>
                            <th scope="col">Descripción</th>
                            <th scope="col">Estado</th>
                        </tr>
                    </thead>
                    <tbody id="body-fuentes"></tbody>
                </table>
            </div>
        </div>
    </main>

    <include src="footer.html"></include>

    <script type="module" src="/src/js/depositos.js"></script>
</body>

</html>
