<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usuarios</title>
    <link rel="stylesheet" href="/src/css/usuarios.css" />
</head>

<body>
    <include src="header.html"></include>

    <main>
        <a href="home.html">← Volver al inicio</a>
        <h1>Usuarios</h1>
        <a class="btn" href="usuario-form.html">Nuevo usuario</a>

        <p id="mensaje-usuarios">Cargando usuarios...</p>

        <div id="contenido" hidden>
            <div class="tabla-scroll">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Usuario</th>
                            <th scope="col">Nombre</th>
                            <th scope="col">Correo</th>
                            <th scope="col">Teléfono</th>
                            <th scope="col">Rol</th>
                            <th scope="col">Estado</th>
                            <th scope="col">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="body-usuarios"></tbody>
                </table>
            </div>

            <h2 class="seccion">Roles</h2>
            <div class="tabla-scroll">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Rol</th>
                            <th scope="col">Descripción</th>
                            <th scope="col">Estado</th>
                        </tr>
                    </thead>
                    <tbody id="body-roles"></tbody>
                </table>
            </div>
        </div>
    </main>

    <include src="footer.html"></include>

    <script type="module" src="/src/js/usuarios.js"></script>
</body>

</html>
